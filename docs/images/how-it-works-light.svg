<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 738 196" width="738" height="196" role="img" aria-labelledby="hiw-title">
  <title id="hiw-title">1 Publish, then a loop: 2 Review, 3 Read comments, 4 Build vN+1, 5 Reply and resolve, back to Review</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font-size: 21px; font-weight: 600; fill: #161a21; }
    .num { font-size: 14px; font-weight: 700; fill: #fff; }
    .chip { fill: #fff; stroke: #dfe3ea; }
    .shade { flood-color: #161a21; flood-opacity: .08; }
    .pin { fill: #2b5bd7; }
    .pin.done { fill: #1f7a4a; }
    .loop { stroke: #2b5bd7; }
    .loop-head { fill: #2b5bd7; }
    .entry { stroke: #8a92a0; }
    .entry-head { fill: #8a92a0; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow class="shade" dx="0" dy="2" stdDeviation="3"/>
    </filter>
    <path id="head" d="M-6-6.5L6 0L-6 6.5Z"/>
    <path id="pin" d="M-12 12V0A12 12 0 0 1 0-12A12 12 0 0 1 12 0A12 12 0 0 1 0 12Z" transform="rotate(-45)"/>
  </defs>

  <g id="connectors" fill="none" stroke-width="2.5" stroke-linecap="round">
    <path class="entry" d="M159 40H240"/>
    <path class="loop" d="M324 40H613V156H324Z"/>
  </g>
  <use class="entry-head" xlink:href="#head" href="#head" x="245" y="40"/>
  <g class="loop-head">
    <use xlink:href="#head" href="#head" transform="translate(448 40)"/>
    <use xlink:href="#head" href="#head" transform="translate(613 98) rotate(90)"/>
    <use xlink:href="#head" href="#head" transform="translate(486 156) rotate(180)"/>
    <use xlink:href="#head" href="#head" transform="translate(324 98) rotate(-90)"/>
  </g>

  <g filter="url(#lift)">
    <rect class="chip" x="8" y="14" width="143" height="52" rx="26"/>
    <rect class="chip" x="253" y="14" width="142" height="52" rx="26"/>
    <rect class="chip" x="496" y="14" width="234" height="52" rx="26"/>
    <rect class="chip" x="524" y="130" width="178" height="52" rx="26"/>
    <rect class="chip" x="199" y="130" width="249" height="52" rx="26"/>
  </g>

  <g id="steps" text-anchor="middle">
    <g id="publish">
      <use class="pin" xlink:href="#pin" href="#pin" x="33" y="37"/>
      <text class="num" x="33" y="42">1</text>
      <text class="label" x="92.5" y="47.5">Publish</text>
    </g>
    <g id="review">
      <use class="pin" xlink:href="#pin" href="#pin" x="278" y="37"/>
      <text class="num" x="278" y="42">2</text>
      <text class="label" x="337" y="47.5">Review</text>
    </g>
    <g id="read-comments">
      <use class="pin" xlink:href="#pin" href="#pin" x="521" y="37"/>
      <text class="num" x="521" y="42">3</text>
      <text class="label" x="626" y="47.5">Read comments</text>
    </g>
    <g id="build">
      <use class="pin" xlink:href="#pin" href="#pin" x="549" y="153"/>
      <text class="num" x="549" y="158">4</text>
      <text class="label" x="626" y="163.5">Build vN+1</text>
    </g>
    <g id="reply-and-resolve">
      <use class="pin done" xlink:href="#pin" href="#pin" x="224" y="153"/>
      <text class="num" x="224" y="158">5</text>
      <text class="label" x="336.5" y="163.5">Reply and resolve</text>
    </g>
  </g>
</svg>
