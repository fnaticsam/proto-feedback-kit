<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f2ea;--card:#fffdf8;--ink:#1d3327;--muted:#5d6c61;--faint:#b7bfb2;--line:#e6e0d3;
  --leaf:#2f7d4f;--leaf-soft:#e2eedf;--water:#2c6fae;--water-soft:#e1edf8;--clay:#a4471f;--clay-soft:#f7e5da;
  --thirsty:#a4471f;--art-bg:#edf0e4;
  --shadow:0 1px 2px rgba(29,51,39,.06),0 8px 24px rgba(29,51,39,.08);
}
*{box-sizing:border-box}
html{background:#e7e2d5;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 15% 10%,#efe9dc 0,transparent 40%),radial-gradient(circle at 85% 90%,#dfe7d6 0,transparent 45%),#e7e2d5;display:flow-root;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1{font-size:30px;line-height:1.12;letter-spacing:-.02em;margin:0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.app{position:relative;max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:600px){.app{margin:28px auto;min-height:calc(100vh - 56px);border-radius:34px;box-shadow:0 30px 80px rgba(29,51,39,.18)}}
main{flex:1;padding:28px 20px 24px}
.enter{animation:enter .26s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{margin-bottom:22px}
.date{margin:0 0 6px;color:var(--muted);font-size:14px}
.streak{display:flex;align-items:center;gap:14px;margin:16px 0 0}
.streak ol{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.streak li{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.streak i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--leaf);color:#fff}
.streak li.today i{background:transparent;box-shadow:inset 0 0 0 2px var(--leaf);color:var(--leaf)}
.streak li.today.won i{background:var(--leaf);color:#fff;animation:pop .4s ease-out}
.streak b{font-size:15px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--leaf);color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.94)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;margin-bottom:14px;min-height:44px}

/* Today */
.tasks{list-style:none;margin:0 0 30px;padding:0;display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.task-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.task .art{width:56px;height:56px;border-radius:16px;flex:none}
.task b{display:block;font-size:17px}
.task small{color:var(--muted);font-size:14px}
.late{color:var(--clay)}
.check{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--water-soft);color:var(--water);transition:background .2s,color .2s,transform .15s}
.check.feed{background:var(--leaf-soft);color:var(--leaf)}
.check:active{transform:scale(.92)}
.check .ok{display:none}
.task.done .check .ok{display:block}
.task.done .check .todo{display:none}
.task.done{opacity:.55}
.task.done b{text-decoration:line-through;text-decoration-color:rgba(29,51,39,.35)}
.task.done .check{background:var(--leaf);border-color:var(--leaf);animation:pop .35s ease-out}
.task.done .check{color:#fff}
@keyframes pop{50%{transform:scale(1.25)}}
.soon{list-style:none;padding:0;margin:0}
.soon li a{display:flex;align-items:center;gap:12px;padding:8px 0;min-height:48px}
.soon .art{width:40px;height:40px;border-radius:12px}
.soon .nm{flex:1}
.soon small{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:24px 10px 30px}
.empty .art{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;background:var(--leaf-soft);--art-bg:var(--leaf-soft)}
.empty .art svg{animation:sway 4s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.empty p{color:var(--muted);margin:6px 0 18px}

/* Plants */
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -20px 18px;padding:0 20px 4px;scrollbar-width:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--card);font-size:14px;box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,color .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--card);border-radius:22px;padding:10px 10px 14px;box-shadow:var(--shadow);transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pcard .art{aspect-ratio:1;border-radius:16px;margin-bottom:10px}
.pcard b{display:block;padding:0 4px}
.pcard small{display:block;padding:0 4px;color:var(--muted);font-size:14px}
.pcard small.thirsty{color:var(--thirsty);font-weight:600}
.art{background:var(--art-bg);display:grid;place-items:center;overflow:hidden}
.art svg{width:100%;height:100%;display:block}

/* Plant */
.hero{text-align:center;margin-bottom:20px;--art-bg:var(--leaf-soft)}
.hero .art{width:168px;height:168px;margin:0 auto 12px;border-radius:50%;background:var(--leaf-soft)}
.hero .art svg{animation:sway 5s ease-in-out infinite;transform-origin:50% 95%}
.hero .species{margin:4px 0 0;color:var(--muted)}
.hero .due{margin:10px 0 0;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--water)}
.hero .due.late{color:var(--clay)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right}
.about{color:var(--muted);font-size:14px;margin:14px 0 0}
.legend{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted);margin:2px 4px 4px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:var(--water);color:#fff;font-weight:650;font-size:16px;box-shadow:0 6px 16px rgba(44,111,174,.28);transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta.leaf{background:var(--leaf);box-shadow:0 6px 16px rgba(47,125,79,.25)}
section.block{margin-top:28px}
.chart{background:var(--card);border-radius:20px;padding:14px 12px 8px;box-shadow:var(--shadow)}
.chart>svg{display:block;width:100%;height:auto}
.chart text{font-size:10px;fill:var(--muted)}
.history{list-style:none;margin:0;padding:0}
.history li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.history li:last-child{border-bottom:0}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.dot.water{background:var(--water-soft);color:var(--water)}
.dot.feed{background:var(--leaf-soft);color:var(--leaf)}
.dot.pot{background:var(--clay-soft);color:var(--clay)}
.history .tx{flex:1}
.history small{color:var(--muted);font-size:14px}

/* Forms */
.field{margin-bottom:22px}
.field>label,.field>.label{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.input{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(47,125,79,.15)}
.input.bad{border-color:#b3261e}
.err{color:#b3261e;font-size:14px;margin:6px 0 0;display:flex;gap:6px;align-items:center}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sp{border-radius:16px;background:var(--card);padding:6px 4px 8px;font-size:12px;text-align:center;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,background .2s}
.sp .art{aspect-ratio:1;border-radius:12px;margin-bottom:4px}
.sp[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--leaf);background:#f1f7ef}
.seg{display:flex;background:#ebe6da;border-radius:14px;padding:4px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-size:15px;transition:background .2s,box-shadow .2s}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:22px;line-height:1}
.stepper output{min-width:96px;text-align:center;font-size:18px;font-weight:600}
.preview{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;background:var(--leaf-soft);--art-bg:var(--leaf-soft)}
.preview svg{animation:enter .3s ease-out}

/* Settings */
.group{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 16px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set select{border:0;background:transparent;color:var(--muted);font-size:16px;text-align:right}
.set .seg{min-width:130px}
.set .seg button{min-height:34px}
.switch{width:52px;height:32px;border-radius:999px;background:#d6d2c7;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked=true]{background:var(--leaf)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.note{color:var(--muted);font-size:14px;margin:-14px 4px 24px}
.foot{text-align:center;color:var(--muted);font-size:13px}

/* Chrome */
.tabs{position:sticky;bottom:12px;margin:0 16px 12px;display:flex;justify-content:space-around;background:rgba(255,253,248,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;box-shadow:0 8px 30px rgba(29,51,39,.16);padding:6px;z-index:5}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;border-radius:18px;transition:color .2s,background .2s}
.tabs a[aria-current=page]{color:var(--leaf);background:var(--leaf-soft);font-weight:600}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;display:flex;gap:16px;align-items:center;transition:opacity .25s,transform .25s;z-index:10;max-width:calc(100% - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#b9e3c3;font-weight:700}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  document.addEventListener('change', function (e) {
    if (e.target.id === 'proom') S.form.room = e.target.value;
    if (e.target.id === 'ptime') S.time = e.target.value;
  });
  window.addEventListener('hashchange', function () { render(); });
  if (!/^#\//.test(location.hash)) history.replaceState(null, '', '#/today');
  render();
})();
</script>
</body>
</html>
