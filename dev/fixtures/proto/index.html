<title>Home</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243d;font:16px/1.5 system-ui,sans-serif}
  header{padding:24px;background:#dbe8ff;border-bottom:3px solid #3466bd}
  nav{display:flex;flex-wrap:wrap;gap:24px}a{color:#224f98}main{padding:28px;max-width:760px;margin:auto}
  h1{font-size:36px;margin-top:0}.card{padding:24px;border:1px solid #bccde6;border-radius:12px;background:white}
  #landmark{margin-top:320px;padding:24px;background:#ffd98b;border:2px solid #ad721a}
  .long{min-height:1600px}[hidden]{display:none!important}
  body.round-two header{background:#d8f0e5;border-color:#247255}body.round-two h1{color:#247255}
</style>
<header><nav aria-label="Screens"><a href="#/home">Home</a><a href="#/list">List</a><a href="#/detail">Detail</a></nav><p id="round"></p></header>
<main>
  <section data-screen="home" class="long"><h1>Home</h1><div class="card">Welcome to the feedback prototype. Try a screen, then leave a note.</div><div id="landmark">A fixed point in the scrolling content</div></section>
  <section data-screen="list" hidden><h1>List</h1><div class="card"><a href="#/detail">Open the first item</a></div></section>
  <section data-screen="detail" hidden><h1>Detail</h1><div class="card">The details of the first item.</div></section>
</main>
<script src="app.js"></script>
